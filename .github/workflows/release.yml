name: Release

on:
  push:
    tags: ['v*']        # tag like v0.1.0 -> build, sign, release
  workflow_dispatch:    # manually trigger from Actions tab

permissions:
  contents: write       # required to publish releases

jobs:
  # Build update.exe and Transcriptarr.exe on a Windows runner.
  # Order matters: update.exe is built first, because Transcriptarr.spec
  # bundles dist/update.exe inside Transcriptarr.exe so the wizard can
  # extract it into the install folder during setup.
  build:
    runs-on: windows-latest
    outputs:
      transcriptarr-id: ${{ steps.upload-transcriptarr.outputs.artifact-id }}
      update-id:        ${{ steps.upload-update.outputs.artifact-id }}
      version:          ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter

      - name: Build update.exe (step 1 of 2)
        run: pyinstaller Update.spec --clean --noconfirm

      - name: Build Transcriptarr.exe (step 2 of 2, bundles update.exe)
        run: pyinstaller Transcriptarr.spec --clean --noconfirm

      - name: Upload Transcriptarr.exe artifact
        id: upload-transcriptarr
        uses: actions/upload-artifact@v4
        with:
          name: Transcriptarr-unsigned
          path: dist/Transcriptarr.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload update.exe artifact
        id: upload-update
        uses: actions/upload-artifact@v4
        with:
          name: update-unsigned
          path: dist/update.exe
          if-no-files-found: error
          retention-days: 7

  # Optional signing pass through SignPath. Skipped automatically until the
  # SignPath GitHub repo variables are configured. Both binaries get signed.
  sign:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    outputs:
      signed: ${{ steps.sign-transcriptarr.outcome == 'success' && steps.sign-update.outcome == 'success' }}
    steps:
      - name: Submit Transcriptarr.exe to SignPath
        id: sign-transcriptarr
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_POLICY_SLUG }}'
          github-artifact-id: '${{ needs.build.outputs.transcriptarr-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed-transcriptarr'

      - name: Submit update.exe to SignPath
        id: sign-update
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_POLICY_SLUG }}'
          github-artifact-id: '${{ needs.build.outputs.update-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed-update'

      - name: Upload signed Transcriptarr.exe
        uses: actions/upload-artifact@v4
        with:
          name: Transcriptarr-signed
          path: signed-transcriptarr/Transcriptarr.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed update.exe
        uses: actions/upload-artifact@v4
        with:
          name: update-signed
          path: signed-update/update.exe
          if-no-files-found: error
          retention-days: 30

  # On a tag push, publish both binaries (signed when available, unsigned
  # otherwise) as a draft GitHub release. Review the draft on the Releases
  # page, edit notes, then click Publish.
  release:
    needs: [build, sign]
    if: startsWith(github.ref, 'refs/tags/v') && always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Transcriptarr.exe (signed)
        if: needs.sign.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Transcriptarr-signed
          path: release

      - name: Download update.exe (signed)
        if: needs.sign.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: update-signed
          path: release

      - name: Download Transcriptarr.exe (unsigned fallback)
        if: needs.sign.result != 'success'
        uses: actions/download-artifact@v4
        with:
          name: Transcriptarr-unsigned
          path: release

      - name: Download update.exe (unsigned fallback)
        if: needs.sign.result != 'success'
        uses: actions/download-artifact@v4
        with:
          name: update-unsigned
          path: release

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.build.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            release/Transcriptarr.exe
            release/update.exe
          fail_on_unmatched_files: true
