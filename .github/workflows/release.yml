name: Release

on:
  push:
    tags: ['v*']        # tag like v0.1.0 -> build, sign, release
  workflow_dispatch:    # manually trigger from Actions tab

permissions:
  contents: write       # required to publish releases

jobs:
  # --------------------------------------------------------------------------
  # 1. Build the unsigned .exe on a Windows runner
  # --------------------------------------------------------------------------
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter

      - name: Build Transcriptarr.exe
        run: pyinstaller Transcriptarr.spec --clean --noconfirm

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Transcriptarr-unsigned
          path: dist/Transcriptarr.exe
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  # 2. Send the unsigned artifact to SignPath, get the signed copy back.
  #    Skipped automatically if SignPath secrets aren't configured yet.
  # --------------------------------------------------------------------------
  sign:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    outputs:
      signed: ${{ steps.sign.outcome == 'success' }}
    steps:
      - name: Submit to SignPath
        id: sign
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_POLICY_SLUG }}'
          github-artifact-id: '${{ needs.build.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed'

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: Transcriptarr-signed
          path: signed/Transcriptarr.exe
          if-no-files-found: error
          retention-days: 30

  # --------------------------------------------------------------------------
  # 3. On a tag push, publish the signed (or unsigned, if SignPath isn't
  #    configured) .exe as a draft GitHub release. You review and click
  #    "Publish" when ready.
  # --------------------------------------------------------------------------
  release:
    needs: [build, sign]
    if: startsWith(github.ref, 'refs/tags/v') && always()
    runs-on: ubuntu-latest
    steps:
      - name: Download signed artifact
        if: needs.sign.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Transcriptarr-signed
          path: release

      - name: Download unsigned artifact (fallback)
        if: needs.sign.result != 'success'
        uses: actions/download-artifact@v4
        with:
          name: Transcriptarr-unsigned
          path: release

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.build.outputs.version }}
          draft: true
          generate_release_notes: true
          files: release/Transcriptarr.exe
          fail_on_unmatched_files: true
